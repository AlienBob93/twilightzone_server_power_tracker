# /etc/nut/upsd.conf
#
# Listen on the Docker bridge so the ups-monitor container can reach upsd.
# If you prefer not to expose NUT on every interface, replace 0.0.0.0 with the
# host's docker bridge address (usually 172.17.0.1) and keep the firewall rule
# below scoped to the container network.
LISTEN 0.0.0.0 3493

MAXAGE 15
MAXCONN 64
