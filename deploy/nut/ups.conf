# /etc/nut/ups.conf
#
# CyberPower EC850LCD. usbhid-ups auto-detects the USB device, so no bus/device
# number is hardcoded and USB re-enumeration after a reboot is harmless.

maxretry = 3

[ec850lcd]
    driver = usbhid-ups
    port = auto
    desc = "CyberPower EC850LCD"
    # Optional: pin the USB vendor. CyberPower Systems = 0764.
    # vendorid = 0764
