name: Test and Deploy to Dockhand

# Uses this repo's own Tailscale OAuth client (tag:ci), created 2026-11-03.
# The older tag:ci client is still used by twilightzone-tracker-server. Both
# carry the same tag, so tailnet access is identical, but rotating or deleting
# one does not affect the other — never delete a client a repo still references.
on:
  push:
    branches: [ mqtt-ha-integration ]

permissions:
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    # The OIDC token is minted at workflow level for the tailnet. This job only
    # compiles and runs the suite, so it must not be able to request one.
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Follows the go directive in go.mod instead of pinning a version here.
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # -race needs cgo, so it runs here (gcc is on ubuntu-latest) and not in
      # the Dockerfile, whose build stage sets CGO_ENABLED=0.
      - name: Test
        run: go test -race ./...

  deploy:
    # A red suite means the image never reaches Dockhand.
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: dockhand-deploy-ups-mqtt
      cancel-in-progress: false
    steps:
      # Pinned to v4.2.0 for supply-chain safety; tracker-server uses @v4.
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Dockhand git stack sync
        env:
          DOCKHAND_STACK_ID: ${{ vars.DOCKHAND_STACK_ID }}
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "X-Gitlab-Token: $DOCKHAND_WEBHOOK_SECRET" \
            "https://dockhand.tail7c4ba4.ts.net/api/git/stacks/$DOCKHAND_STACK_ID/webhook"
