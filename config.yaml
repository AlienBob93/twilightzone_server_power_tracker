# UPS Monitor configuration.
#
# This file is baked into the container image at
# /etc/ups-monitor/config.yaml. Every value can be overridden with the
# environment variables documented in README.md.

server:
  address: "0.0.0.0:8080"
  refresh_seconds: 10

nut:
  # host.docker.internal is provided by the docker-compose extra_hosts entry
  # and resolves to the Docker host, where upsd listens on port 3493.
  host: "host.docker.internal"
  port: 3493
  ups: ""            # empty or "auto" = first UPS advertised by upsd
  username: ""       # optional; only needed if upsd restricts variable reads
  password: ""
  timeout: 5s

collector:
  interval: 10s

storage:
  path: "/var/lib/ups-monitor/data.db"
  retention: 720h    # 30 days; 0 disables pruning

logging:
  level: "info"      # debug | info | warn | error
  format: "text"     # text | json
